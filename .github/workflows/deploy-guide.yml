name: Deploy Movie Vault guide

on:
  push:
    branches: [main]
    paths:
      - "guide/**"
      - "scripts/build_guide.py"
      - "epg/**"
      - "English_TV_Essentials_US.m3u"
      - ".github/workflows/deploy-guide.yml"
  schedule:
    - cron: "25 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: movie-vault-guide
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}guide/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh authorized XMLTV data
        run: |
          git clone --depth 1 --branch master https://github.com/iptv-org/epg.git "$RUNNER_TEMP/iptv-org-epg"
          npm --prefix "$RUNNER_TEMP/iptv-org-epg" ci
          npm --prefix "$RUNNER_TEMP/iptv-org-epg" run grab -- \
            --channels="$GITHUB_WORKSPACE/epg/epg.channels.xml" \
            --output="$GITHUB_WORKSPACE/epg/guide.xml" \
            --days=3 \
            --maxConnections=4
          python3 epg/validate_guide.py epg/guide.xml --minimum-channels=35
      - name: Build guide data from published playlist
        run: >-
          python3 scripts/build_guide.py
          --playlist https://raw.githubusercontent.com/JColeLatt/vlc-iptv-playlist/main/English_TV_Essentials_US.m3u
          --epg epg/guide.xml
          --output guide/data/channels.json
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R guide _site/guide
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
